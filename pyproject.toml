[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envdoctor"
version = "1.0.0"
description = "Validate .env keys against .env.example — catch missing config before deploy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kian Zarandi", email = "kianzarandi701@gmail.com" }]
keywords = ["dotenv", "env", "cli", "validation", "devops"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kianPk/envdoctor"
Repository = "https://github.com/kianPk/envdoctor"

[project.scripts]
envdoctor = "envdoctor.cli:main"

[tool.setuptools.packages.find]
include = ["envdoctor*"]
